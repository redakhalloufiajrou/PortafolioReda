<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>R&M Wiki | Contribuir</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="body">
  <header class="site-header">
    <div class="brand"></div>

    <nav class="site-nav">
      <a class="site-nav__link" href="index.html">Inicio</a>
      <a class="site-nav__link" href="sobre_nosotros.html">Sobre nosotros</a>
      <a class="site-nav__link" href="buscar_personaje.html">Buscar personajes</a>
    </nav>
  </header>

  <main class="container-contribuir">
    <section class="page-hero">
      <h1 class="page-hero__title">Proponer mejora</h1>
      <p class="page-hero__subtitle">Ayuda a mejorar la wiki del multiverso.</p>
    </section>

    <form class="form" action="#" method="post">
      <label class="form__field">
        <span class="form__label">Título del artículo</span>
        <input class="form__input" type="text" name="titulo" placeholder="Ej: Morty Smith" />
      </label>

      <label class="form__field">
        <span class="form__label">Categoría</span>
        <select class="form__select" name="categoria">
          <option value="">Selecciona una</option>
          <option>Personaje</option>
          <option>Episodio</option>
          <option>Lugar</option>
          <option>Objeto</option>
        </select>
      </label>

      <label class="form__field">
        <span class="form__label">Descripción</span>
        <textarea class="form__textarea" name="descripcion" rows="6" placeholder="Escribe la propuesta..."></textarea>
      </label>

      <fieldset class="form__fieldset">
        <legend class="form__legend">Nivel de spoiler</legend>
        <label class="form__radio1">
          <input type="radio" name="spoiler" />
          <span>Sin spoilers</span>
        </label>
        <label class="form__radio2">
          <input type="radio" name="spoiler" />
          <span>Leves</span>
        </label>
        <label class="form__radio3">
          <input type="radio" name="spoiler" />
          <span>Altos</span>
        </label>
      </fieldset>

      <button class="btn3" type="submit">Enviar propuesta</button>
    </form>
  </main>

  <footer class="site-footer">
    <div class="site-footer__links">
      <a href="https://www.instagram.com/rickandmorty/" class="site-footer__link">
        <img src="img/insta4.png" alt="Instagram" width="50">
      </a>
      <a href="https://x.com/RickandMorty?lang=es" class="site-footer__link">
        <img src="img/twitter.png" alt="X" width="50">
      </a>
      <a href="https://youtu.be/E8cXKMR9a1Q?si=X8JqIAxzjhmQUxSX" class="site-footer__link">
        <img src="img/youtube1.png" alt="YouTube" width="50">
      </a>
      <a href="https://mail.google.com/mail/u/0/#inbox" class="site-footer__link">
        <img src="img/gmail.png" alt="Gmail" width="50">
      </a>
    </div>
  </footer>
</body>
</html>
